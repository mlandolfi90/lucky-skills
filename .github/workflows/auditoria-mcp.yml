# Un test de fuga que nadie corre no es proteccion: es documentacion de una
# intencion. Y el que se rompe en silencio es justo el que impedia escribir una
# password en disco.
#
# Scopeado al paquete a proposito: `lucky-skills` es un catalogo de skills y no
# un repo de Python, asi que este workflow no puede decir nada sobre el resto.
name: lucky-auditoria-mcp

on:
  push:
    paths: ["packages/lucky-auditoria-mcp/**", ".github/workflows/auditoria-mcp.yml"]
  pull_request:
    paths: ["packages/lucky-auditoria-mcp/**", ".github/workflows/auditoria-mcp.yml"]

defaults:
  run:
    working-directory: packages/lucky-auditoria-mcp

jobs:
  pruebas:
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        # Que esta medido de verdad, y por quien:
        #   3.12.10 -> a mano, las dos sesiones, en dos venv de la misma
        #              maquina (que no son dos entornos); y este CI en verde,
        #              ubuntu y windows.
        #   3.13    -> este CI en verde, ubuntu y windows. Antes decia "medido
        #              por skills-v3-65" a mano y era falso (su venv era 3.12);
        #              despues decia "nadie" y tambien era falso: el CI ya lo
        #              habia medido. Ninguna de las dos sesiones miro los runs.
        #   3.10    -> este CI en ROJO tres veces (0.3.1 y su tag): el test que
        #              comparaba tomli contra tomllib importaba tomllib donde
        #              no existe. Desde 0.3.2 ese test se salta en 3.10 con
        #              motivo; la celda 3.10 mide el respaldo real (tomli).
        # Un CI que corre no es una medicion hasta que alguien lee el
        # resultado: `gh run list --workflow auditoria-mcp.yml`.
        python: ["3.10", "3.12", "3.13"]
        # Los dos, porque el directorio por defecto se resuelve distinto
        # (`%LOCALAPPDATA%` contra `XDG_STATE_HOME`) y ahi vive la regla que
        # saca el registro de los repos ajenos.
        so: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
